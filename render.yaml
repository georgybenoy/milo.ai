services:
  - type: web
    name: milo
    runtime: python
    buildCommand: |
      pip install -r backend/requirements.txt
      cd frontend && npm install && npm run build && cd ..
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.10.11"
      - key: NODE_VERSION
        value: "20.11.0"
